# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: ESLint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '42 7 * * 3'

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (JSON output)
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-results.json
        continue-on-error: true

      - name: Convert JSON to SARIF
        run: |
          node -e "
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('eslint-results.json', 'utf8'));
            const sarif = {
              version: '2.1.0',
              \$schema: 'https://json.schemastore.org/sarif-2.1.0.json',
              runs: [{
                tool: {
                  driver: {
                    name: 'ESLint',
                    version: '9.x',
                    informationUri: 'https://eslint.org',
                    rules: {}
                  }
                },
                results: results.flatMap(file => 
                  file.messages.map(msg => ({
                    ruleId: msg.ruleId,
                    level: msg.severity === 2 ? 'error' : 'warning',
                    message: { text: msg.message },
                    locations: [{
                      physicalLocation: {
                        artifactLocation: { uri: file.filePath.replace(process.cwd() + '/', '') },
                        region: { startLine: msg.line || 1, startColumn: msg.column || 1 }
                      }
                    }]
                  }))
                )
              }]
            };
            fs.writeFileSync('eslint-results.sarif', JSON.stringify(sarif, null, 2));
          "

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true